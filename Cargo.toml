[package]
name = "gguf-rs"
version = "0.2.0"
description = "GGUF file parser"
edition = "2021"
license = "MIT"
authors = [
    "Zack Shen <zackshen0526@gmail.com>",
    "Britt Lewis <brittlewis12@gmail.com>",
]
keywords = ["gguf", "parser", "GPT", "llama", "llm"]
repository = "https://github.com/brittlewis12/gguf"
homepage = "https://github.com/brittlewis12/gguf"
include = [
    "src/**/*",
    "benches/**/*",
    "tests/**/*",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
]
categories = ["parser-implementations", "science"]

[dependencies]
anyhow = "1.0.101"
byteorder = "1.5.0"
clap = { version = "4.5.58", features = ["derive"] }
comfy-table = "7.2.2"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
simple_logger = "5.0.1"

# Optional dependencies
memmap2 = { version = "0.9", optional = true }
tokio = { version = "1", optional = true, features = ["fs", "io-util", "rt-multi-thread", "macros"] }

[dev-dependencies]
criterion = "0.8"

[features]
default = []
debug = []
mmap = ["memmap2"]
async = ["tokio"]

[[bench]]
name = "parse"
harness = false
